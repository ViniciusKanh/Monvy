name: Publish monvy-finance

# Workflow dedicado ao pacote @viniciuskanh/monvy-finance (packages/monvy-finance).
# Não interfere no workflow principal do app (.github/workflows/ci.yml).
#
# - Em pull requests e pushes que tocam o pacote: apenas valida (typecheck, testes, build,
#   npm pack --dry-run e instalação em um projeto consumidor temporário). NUNCA publica.
# - Em uma tag no padrão `monvy-finance-v*` (ex.: monvy-finance-v0.1.0): valida tudo de novo e,
#   se a versão do package.json bater com a tag e a versão ainda não existir no registro,
#   publica em DOIS registros, em paralelo:
#     - GitHub Packages (job `publish-github`), autenticado com o GITHUB_TOKEN do próprio
#       workflow — não exige segredo adicional.
#     - npmjs.org, o registro público do npm (job `publish-npmjs`), para que o pacote possa ser
#       instalado em qualquer lugar (StackBlitz, CodeSandbox, Replit, CI de terceiros, etc.) sem
#       token nenhum. Exige o segredo de repositório `NPM_TOKEN` (um token de automação gerado em
#       npmjs.com, da conta/organização dona do escopo @viniciuskanh) — sem esse segredo
#       configurado, o job falha e NÃO quebra a publicação no GitHub Packages (jobs independentes).
#   Cada job de publicação usa seu próprio ambiente do GitHub (`npm-packages` / `npm-public`) —
#   configure regras de proteção de ambiente para exigir aprovação manual antes do deploy, já que
#   esta tarefa não deve publicar sem autorização humana.

on:
  pull_request:
    paths:
      - 'packages/monvy-finance/**'
      - '.github/workflows/publish-monvy-finance.yml'
  push:
    # Nota: o filtro `paths` do GitHub Actions não é aplicado de forma confiável a pushes de tag
    # (o diff de arquivos de uma tag pode não ser o esperado), então ele é omitido aqui e os
    # branches/tags são combinados no mesmo gatilho (OR): roda em push para main/master OU em
    # tag `monvy-finance-v*`. O job `publish` abaixo só executa de fato quando o ref for uma tag.
    branches: [main, master]
    tags:
      - 'monvy-finance-v*'

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/monvy-finance

jobs:
  validate:
    name: Validar pacote (typecheck, testes, build, pack)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/monvy-finance/package-lock.json

      - name: Instalar dependências (reprodutível)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build + testes (contra o artefato empacotado)
        run: npm test

      - name: Auditar conteúdo do tarball (npm pack --dry-run)
        run: npm pack --dry-run

      - name: Testar instalação em projeto consumidor temporário
        run: |
          set -e
          npm pack
          TARBALL=$(ls viniciuskanh-monvy-finance-*.tgz | head -n1)
          mkdir -p /tmp/monvy-finance-consumer
          cp "$TARBALL" /tmp/monvy-finance-consumer/
          cd /tmp/monvy-finance-consumer
          echo '{ "name": "consumer-test", "version": "1.0.0", "private": true, "type": "module" }' > package.json
          npm install "./$TARBALL"
          cat > test.mjs <<'NODEEOF'
          import { simulateCompoundInterest, calculatePrice } from '@viniciuskanh/monvy-finance';
          const r = simulateCompoundInterest({ initialAmount: 100, monthlyContribution: 10, annualRate: 5, months: 12 });
          if (!(r.finalBalance > 100)) throw new Error('simulateCompoundInterest não funcionou a partir do tarball');
          const p = calculatePrice({ principal: 1200, monthlyRatePct: 0, months: 12 });
          if (p.installment !== 100) throw new Error('calculatePrice não funcionou a partir do tarball');
          console.log('OK: pacote instalado e funcional a partir do tarball.');
          NODEEOF
          node test.mjs

  publish-github:
    name: Publicar no GitHub Packages
    needs: validate
    if: startsWith(github.ref, 'refs/tags/monvy-finance-v')
    runs-on: ubuntu-latest
    environment: npm-packages
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/monvy-finance/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@viniciuskanh'

      - name: Instalar dependências
        run: npm ci

      - name: Conferir que a tag corresponde à versão do package.json
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#monvy-finance-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ($GITHUB_REF_NAME) não corresponde à versão do package.json ($PKG_VERSION)." >&2
            exit 1
          fi

      - name: Conferir que a versão ainda não foi publicada no GitHub Packages
        run: |
          set -e
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@viniciuskanh/monvy-finance@$PKG_VERSION" version 2>/dev/null; then
            echo "Versão $PKG_VERSION já publicada no GitHub Packages — abortando para não sobrescrever." >&2
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck, testes e build
        run: npm test && npm run typecheck

      - name: Publicar no GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npmjs:
    name: Publicar no npmjs.org (registro público)
    needs: validate
    if: startsWith(github.ref, 'refs/tags/monvy-finance-v')
    runs-on: ubuntu-latest
    environment: npm-public
    permissions:
      contents: read
    env:
      # No npmjs.org o pacote é publicado SEM escopo, como "monvy-finance" (o escopo
      # @viniciuskanh não estava disponível para a conta do autor nesse registro). No GitHub
      # Packages o nome continua "@viniciuskanh/monvy-finance" normalmente — são dois nomes,
      # um em cada registro, documentados no README do pacote.
      PUBLIC_PACKAGE_NAME: monvy-finance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/monvy-finance/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Instalar dependências
        run: npm ci

      - name: Conferir que a tag corresponde à versão do package.json
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#monvy-finance-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ($GITHUB_REF_NAME) não corresponde à versão do package.json ($PKG_VERSION)." >&2
            exit 1
          fi

      - name: Conferir que a versão ainda não foi publicada no npmjs.org
        run: |
          set -e
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PUBLIC_PACKAGE_NAME@$PKG_VERSION" version --registry=https://registry.npmjs.org 2>/dev/null; then
            echo "Versão $PKG_VERSION já publicada no npmjs.org — abortando para não sobrescrever." >&2
            exit 1
          fi

      - name: Typecheck, testes e build
        run: npm test && npm run typecheck

      - name: "Publicar no npmjs.org (nome sem escopo: monvy-finance)"
        run: |
          set -e
          npm pkg set name="$PUBLIC_PACKAGE_NAME"
          # publishConfig.registry aponta pro GitHub Packages (usado pelo job publish-github) e
          # tem precedência sobre qualquer .npmrc/registry-url — precisa ser removido aqui, senão
          # o npm publish tenta ir pro registro errado mesmo com --registry/.npmrc configurados.
          npm pkg delete publishConfig
          npm publish
          # reverte name e publishConfig localmente no runner (não é commitado — o checkout do job é descartado ao fim)
          git checkout -- package.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
